name: insights

# Weekly SUSEP SES insights agent. Reads BigQuery (read-only SA via WIF),
# publishes the report + SQL appendix + run log to the GCS reports bucket
# and e-mails the report for human review. Nothing is committed to the repo.
#
# Weekly (not daily) on purpose: the SUSEP dump refreshes ~monthly, so a daily
# report mostly re-analyzed unchanged marts. Scheduled ~2h after the Monday
# ingest so a fresh period (when there is one) is already in the marts; on a
# new period the ingest workflow also dispatches this one directly.
#
# Decoupled from the ingestion pipeline on purpose: it assumes the marts
# (susep_ses_marts.fct_seguros) are already built. Test via "Run workflow"
# before relying on the cron.

on:
  schedule:
    - cron: "0 14 * * 1" # Mondays 14:00 UTC ≈ 11:00 BRT (~2h after ingest.yml)
  workflow_dispatch:

permissions:
  contents: read # checkout only — reports no longer enter the repo
  id-token: write # WIF auth to GCP

# Opt into Node 24 for the JS actions (silences the Node 20 deprecation).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# No concurrency guard on purpose: each dispatch should run to completion and
# produce its own report (stems are reserved against the GCS manifest; reruns
# get a _2/_3 suffix, nothing is overwritten).

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_BQ_LOCATION: US
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_AGENT_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group agent

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Claude Code CLI (required by the Agent SDK)
        run: npm install -g @anthropic-ai/claude-code@2.1.201 # pin; bump periodically

      - name: Build dbt glossary (manifest.json)
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Run insights agent (publishes to GCS + e-mails the report)
        env:
          # Subscription auth (claude setup-token, Pro/Max): when the token
          # secret is set it wins over the API key and the run bills the
          # Claude subscription instead of API credits. The API key stays as
          # fallback while the token secret is absent (empty = ignored).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Weekly cadence buys a stronger model: Opus (~1.67x Sonnet pricing,
          # ~US$1/run) at ~4 runs/month is ~4x cheaper than daily Sonnet was.
          # CI-only override — the local default stays sonnet/0.75 for cheap
          # test runs (see src/config.py).
          AGENT_MODEL: opus
          AGENT_MAX_BUDGET_USD: "1.25"
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
        run: uv run python -m src.agent.main

      # Salvage net: if the run produced local scratch files (it always does)
      # they're kept as a workflow artifact for 7 days, so even a failed
      # publish/e-mail never loses a generated report.
      - name: Upload local scratch copies as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: report-scratch-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 7
