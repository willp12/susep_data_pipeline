name: insights

# Daily SUSEP SES insights agent. Reads BigQuery (read-only SA via WIF),
# generates reports/YYYY-MM-DD.md, and opens a PR against main for review.
#
# Decoupled from the ingestion pipeline on purpose: it assumes the marts
# (susep_ses_marts.fct_seguros) are already built. Test via "Run workflow"
# before relying on the cron.

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC ≈ 09:00 BRT
  workflow_dispatch:

permissions:
  contents: write # push the report branch
  pull-requests: write # open the PR
  id-token: write # WIF auth to GCP

# Opt into Node 24 for the JS actions (silences the Node 20 deprecation).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: insights
  cancel-in-progress: true

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_BQ_LOCATION: US
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_AGENT_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group agent

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude Code CLI (required by the Agent SDK)
        run: npm install -g @anthropic-ai/claude-code

      - name: Build dbt glossary (manifest.json)
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Run insights agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python -m src.agent.main

      - name: Open PR with the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_date="$(date -u +%F)"
          branch="report/auto-${report_date}"

          if [ -z "$(git status --porcelain reports/)" ]; then
            echo "No report changes — nothing to open a PR for."
            exit 0
          fi

          git config user.name "susep-insights-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add reports/
          git commit -m "report: insights ${report_date}"
          git push -u origin "${branch}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "report: insights ${report_date}" \
            --body "Automated SUSEP SES insights report generated by the agent. Review the figures before merging."
