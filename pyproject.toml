[project]
name = "susep-ses-pipeline"
version = "0.1.0"
description = "Pipeline de ingestão dos dados públicos SUSEP SES (S3 → BigQuery → dbt)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "truststore>=0.9",
    "polars>=1.0",
    "boto3>=1.34",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.18",
    "pydantic>=2.8",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "dbt-core>=1.11,<1.12",
    "dbt-bigquery>=1.11,<1.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-markdown>=3.10.2.20260518",
]
# Insights agent (CP-B onwards). Kept out of the main deps so the ingestion
# worker doesn't pull the Claude SDK. google-cloud-bigquery is already a
# core dependency, so the BQ tools work without this group installed.
agent = [
    "claude-agent-sdk>=0.1",
    "markdown>=3.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101"]  # assert in tests is fine

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "D"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
