version: 2

models:
  - name: fct_seguros
    description: >
      Curated fact table of SUSEP SES insurance figures — the insights agent's
      preferred source. Already deduped to the latest ingestion snapshot, so no
      _ingestion_date filtering is needed. Grain: one row per (periodo_ref,
      entity_code, economic_group_code, branch_code). Monetary measures are
      NUMERIC (BRL), summed at the grain; loss_ratio is pre-computed. Partitioned
      by month on periodo_ref, clustered by economic_group_code/branch_code.
    columns:
      - name: periodo_ref
        description: "Competence month (DATE, first day). Business time axis for trends/MoM/YoY."
      - name: entity_code
        description: "SUSEP insurer code. String ID with leading zeros."
      - name: economic_group_code
        description: >
          SUSEP economic-group (conglomerate) code of the insurer. 99999 =
          independent insurer with no economic group. NOT a line of business —
          orthogonal to branch_code. Membership can change over time (M&A).
      - name: branch_code
        description: >
          Branch/ramo code — the specific insurance line (4 digits). The
          line-of-business 'grupo de ramos' is the leading 2 digits, not
          economic_group_code.
      - name: premio_direto
        description: "Direct written premium (BRL)."
      - name: premio_de_seguros
        description: "Insurance premium (BRL)."
      - name: premio_retido
        description: "Retained premium net of reinsurance (BRL)."
      - name: premio_ganho
        description: "Earned premium (BRL). Denominator of loss_ratio."
      - name: sinistro_direto
        description: "Direct claims (BRL)."
      - name: sinistro_retido
        description: "Retained claims net of reinsurance (BRL)."
      - name: desp_com
        description: "Commercialisation expense / commissions (BRL)."
      - name: premio_emitido2
        description: "Issued premium, alternate measure (BRL)."
      - name: premio_emitido_cap
        description: "Issued premium, capitalisation (BRL)."
      - name: despesa_resseguros
        description: "Reinsurance expense / premium ceded (BRL)."
      - name: sinistro_ocorrido
        description: "Incurred claims (BRL). Numerator of loss_ratio."
      - name: receita_resseguro
        description: "Reinsurance revenue / recoveries (BRL)."
      - name: sinistros_ocorridos_cap
        description: "Incurred claims, capitalisation (BRL)."
      - name: recuperacao_sinistros_ocorridos_cap
        description: "Recovered incurred claims, capitalisation (BRL)."
      - name: rvne
        description: "Risks in force not yet issued (BRL)."
      - name: conveniodpvat
        description: "DPVAT agreement (BRL)."
      - name: consorciosefundos
        description: "Consortia and funds (BRL)."
      - name: loss_ratio
        description: "Pre-computed sinistro_ocorrido / premio_ganho (NULL when earned premium is 0)."
      - name: _ingestion_date
        description: "Ingestion date of the snapshot this fact was built from (lineage only — already deduped)."
      - name: ramo_group_code
        description: "Line-of-business group code = leading 2 digits of branch_code."
      - name: branch_name
        description: "Ramo (line of business) name, from dim_ramo. NULL if the code isn't in the lookup."
      - name: ramo_group_name
        description: "Line-of-business group name (e.g. '01 - Patrimonial'), from dim_grupo_ramo."
      - name: entity_name
        description: "Insurer name, from dim_entidade."
      - name: economic_group_name
        description: >
          Economic-group (conglomerate) name, from dim_grupo_economico. Note
          01225 = 'INDEPENDENTE' (independent insurers) and 99999 = 'OUTROS
          GRUPOS' — use this name, don't infer from the code.

  - name: dim_ramo
    description: "Ramo (line of business) code → name. Static lookup."
    columns:
      - name: branch_code
        description: "Ramo code (4 digits). Joins fct_seguros.branch_code."
      - name: branch_name
        description: "Official ramo name from SUSEP (Ses_ramos)."

  - name: dim_grupo_ramo
    description: "Branch-group (grupo de ramos) code → name. The code is the 2-digit ramo prefix."
    columns:
      - name: ramo_group_code
        description: "2-digit line-of-business group code. Joins LEFT(branch_code, 2)."
      - name: ramo_group_name
        description: "Group name, e.g. '01 - Patrimonial' (Ses_gruposramos)."

  - name: dim_entidade
    description: "Insurer (entity) code → name. Static lookup."
    columns:
      - name: entity_code
        description: "SUSEP insurer code. Joins fct_seguros.entity_code."
      - name: entity_name
        description: "Insurer name (Ses_cias)."

  - name: dim_grupo_economico
    description: >
      Economic-group code → most recent name (the source varies over time;
      we keep the latest name per code). 01225 = INDEPENDENTE, 99999 = OUTROS GRUPOS.
    columns:
      - name: economic_group_code
        description: "Conglomerate code. Joins fct_seguros.economic_group_code."
      - name: economic_group_name
        description: "Most recent economic-group name (Ses_grupos_economicos)."
