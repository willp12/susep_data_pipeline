name: susep_ses
version: 1.0.0
config-version: 2

profile: susep_ses

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  susep_ses:
    staging:
      +materialized: view
    marts:
      # Silver layer (Fase 3). Tables instead of views: dims are small and
      # joined often, fct_seguros is ~3.5M+ rows where view-on-the-fly casts
      # would dominate query cost. Partition/cluster knobs for fct_seguros
      # live in its own {{ config(...) }} block (more local, more readable).
      +materialized: table
