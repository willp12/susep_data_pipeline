name: susep_ses
version: 1.0.0
config-version: 2

profile: susep_ses

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  susep_ses:
    # Write the _models.yml descriptions into BigQuery (table + columns) on
    # every build, so describe_table and the BigQuery console show the same
    # glossary the insights agent gets from the manifest.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
    marts:
      +materialized: table
      +schema: susep_ses_marts

seeds:
  susep_ses:
    +schema: susep_ses_marts
    cnseg_ramos:
      # Keep ramo_code as text so leading zeros survive (e.g. 0114).
      +column_types:
        ramo_code: string
        segmento: string
        grupo_1: string
        grupo_2: string
