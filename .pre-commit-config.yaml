repos:
  # Secret scanning — blocks API keys, tokens and credentials (incl. sk-ant-,
  # AWS, GCP) in any tracked file before they ever get committed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: detect-private-key

  # Keep this rev in lockstep with the ruff version in uv.lock — a drifted
  # hook formats differently from `ruff format --check` in CI and lets
  # commits through that the CI then rejects.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Keep this rev in lockstep with the mypy version in uv.lock (what CI runs) —
  # a drifted hook can pass locally but fail CI, or vice versa.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^(src|evals)/
        additional_dependencies:
          - pydantic>=2.8
          # The agent's @tool decorator is typed; mypy needs the package
          # present or it flags "untyped decorator" under strict mode.
          - claude-agent-sdk>=0.2
          - types-markdown
